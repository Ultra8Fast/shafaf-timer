<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شفاف — به‌زودی</title>
<style>
:root{
--gold:#f0cf82;
--gold-deep:#e0b95e;
--bg:#07070a;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
width:100%;min-height:100%;
background:var(--bg);
font-family:"Vazirmatn","Segoe UI",Tahoma,Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}
body{
min-height:100vh;
display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;padding:32px;position:relative;overflow-x:hidden;
}
.ambient{
position:fixed;inset:0;pointer-events:none;z-index:0;
background:
radial-gradient(ellipse 55% 40% at 88% 8%,rgba(240,207,130,0.16),transparent 60%),radial-gradient(ellipse 70% 60% at 50% 100%,rgba(240,207,130,0.05),transparent 65%);
}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;}

.logo{width:150px;height:150px;margin-bottom:28px;animation:floatY 4.5s ease-in-out infinite;}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.logo img{
width:100%;height:100%;object-fit:contain;display:block;
animation:logoGlow 2.8s ease-in-out infinite;
}
@keyframes logoGlow{
0%,100%{filter:drop-shadow(0 0 10px rgba(240,207,130,.35));}
50%{filter:drop-shadow(0 0 26px rgba(240,207,130,.8));}
}
h1{
font-size:44px;font-weight:800;color:#fff;margin-bottom:10px;
animation:titleGlow 3s ease-in-out infinite;
}
@keyframes titleGlow{
0%,100%{text-shadow:0 0 12px rgba(255,255,255,.25),0 0 26px rgba(240,207,130,.15);}
50%{text-shadow:0 0 22px rgba(255,255,255,.5),0 0 46px rgba(240,207,130,.4);}
}
p.tag{font-size:16px;color:#cfd2da;margin-bottom:46px;}
p.tag b{color:var(--gold);font-weight:700;}

.cd{display:flex;gap:14px;margin-bottom:34px;}
.cd .box{
width:84px;padding:18px 0;
border-radius:16px;
background:linear-gradient(160deg,#171a22,#0e1017);
border:1px solid rgba(240,207,130,.25);
box-shadow:0 0 20px rgba(240,207,130,.12);
animation:boxHalo 2.6s ease-in-out infinite;
}
@keyframes boxHalo{
0%,100%{box-shadow:0 0 14px rgba(240,207,130,.1);}
50%{box-shadow:0 0 26px rgba(240,207,130,.28);}
}
.cd .num{
font-size:32px;font-weight:800;color:var(--gold);
font-variant-numeric:tabular-nums;
text-shadow:0 0 14px rgba(240,207,130,.5);
}
.cd .lbl{margin-top:6px;font-size:12.5px;color:#9a9eae;}
.status{font-size:14px;color:var(--gold);opacity:.85;min-height:20px;}
@media(max-width:420px){
.cd{gap:8px;}
.cd .box{width:68px;padding:14px 0;}
.cd .num{font-size:24px;}
h1{font-size:34px;}
}
</style>
</head>

const now = new Date();
let diff = releaseDate - now;
if(diff <= 0){
elD.textContent = "00";elH.textContent = "00";elM.textContent = "00";elS.textContent = "00";
elStatus.textContent = "شفاف منتشر شد ✓";
return;
}
const day = Math.floor(diff / (1000*60*60*24));
diff -= day*1000*60*60*24;
const hour = Math.floor(diff / (1000*60*60));
diff -= hour*1000*60*60;
const min = Math.floor(diff / (1000*60));
diff -= min*1000*60;
const sec = Math.floor(diff / 1000);
elD.textContent = pad(day);
elH.textContent = pad(hour);
elM.textContent = pad(min);
elS.textContent = pad(sec);
elStatus.textContent = "";
}
tick();
setInterval(tick,1000);
</script>
